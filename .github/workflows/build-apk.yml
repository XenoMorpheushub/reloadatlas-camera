name: Build APK ReloadAtlas Camera

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Compiler l'APK (buildozer officiel)
        run: |
          docker run --rm -v "$(pwd):/home/user/testcwd" \
            kivy/buildozer buildozer -v android debug

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: ReloadAtlasCamera-APK
          path: bin/*.apk
