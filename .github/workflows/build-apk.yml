          sudo apt-get install -y libtool libtool-bin libltdl-dev autoconf automake patchelfname: Build APK ReloadAtlas Camera

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v5

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Outils de compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y libtool libtool-bin autoconf automake patchelf

      - name: Installer buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Compiler l'APK (debug)
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Diagnostiquer l echec
        if: failure()
        run: |
          echo '===== 60 DERNIERES LIGNES ====='
          tail -n 60 build.log
          echo '===== LIGNES CONTENANT UNE ERREUR ====='
          grep -n -i -E 'error|exception|traceback|failed' build.log | tail -n 30 || echo '(rien trouve)'

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: ReloadAtlasCamera-APK
          path: bin/*.apk
